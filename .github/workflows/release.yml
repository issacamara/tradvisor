name: Build verified release artifacts

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.11
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prepare release directories
        run: mkdir -p dist/functions dist/frontend dist/manifest
      - name: Build and push backend image by release tag
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
        run: |
          test "$GCP_PROJECT_ID" = dev-tradvisor
          test -n "$GCP_REGION"
          test -n "$ARTIFACT_REPOSITORY"
          API_IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradvisor-backend:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --tag "$API_IMAGE" --iidfile dist/backend-image.id backend
          docker push "$API_IMAGE"
          gcloud artifacts docker images describe "$API_IMAGE" \
            --format='value(image_summary.digest)' > dist/backend-registry.digest
          grep -Eq '^sha256:[0-9a-f]{64}$' dist/backend-registry.digest
      - name: Retain backend image artifact
        run: |
          docker save --output dist/backend-image.tar "$(cat dist/backend-image.id)"
      - name: Package locked function archives
        run: |
          for function in shares dividends financials ratings; do
            python3 scripts/release/package_artifact.py \
              --source "functions/$function" \
              --target "function:$function" \
              --output "dist/functions/$function.tar"
          done
      - name: Create release manifest
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          python3 scripts/release/manifest.py \
            --release-id "$RELEASE_ID" \
            --commit "$GITHUB_SHA" \
            --backend-digest "$(cat dist/backend-registry.digest)" \
            --function-archive shares=dist/functions/shares.tar \
            --function-archive dividends=dist/functions/dividends.tar \
            --function-archive financials=dist/functions/financials.tar \
            --function-archive ratings=dist/functions/ratings.tar \
            --rule-version swing=swing-v1 \
            --rule-version long_term=long-term-v1 \
            --toolchain "python=$(python --version | awk '{print $2}')" \
            --output dist/manifest/release-manifest.json
      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tradvisor-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
