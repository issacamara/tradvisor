name: Deploy to GCP

on:
  push:
    branches:
      - production
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Required permissions for Workload Identity Federation
permissions:
  contents: read
  id-token: write  # Required for WIF to request OIDC tokens

jobs:
  # ============================================
  # Job 0: Determine environment
  # ============================================
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    if: github.repository == 'issacamara/tradvisor'
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      project_id: ${{ steps.set-env.outputs.project_id }}
      workload_identity_provider: ${{ steps.set-env.outputs.workload_identity_provider }}
      service_account: ${{ steps.set-env.outputs.service_account }}
      region: ${{ steps.set-env.outputs.region }}
      artifact_registry: ${{ steps.set-env.outputs.artifact_registry }}
      image_name: ${{ steps.set-env.outputs.image_name }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
    
    steps:
      - name: Determine environment
        id: set-env
        run: |
          # Determine environment from branch or input
          if [ "${{ github.event.inputs.environment }}" == "prod" ] || [ "${{ github.ref }}" == "refs/heads/production" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "workload_identity_provider=${{ secrets.PROD_WORKLOAD_IDENTITY_PROVIDER || secrets.DEV_WORKLOAD_IDENTITY_PROVIDER }}" >> $GITHUB_OUTPUT
            echo "service_account=${{ secrets.PROD_SERVICE_ACCOUNT || secrets.DEV_SERVICE_ACCOUNT }}" >> $GITHUB_OUTPUT
            echo "::notice::Using PROD environment"
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "workload_identity_provider=${{ secrets.DEV_WORKLOAD_IDENTITY_PROVIDER }}" >> $GITHUB_OUTPUT
            echo "service_account=${{ secrets.DEV_SERVICE_ACCOUNT }}" >> $GITHUB_OUTPUT
            echo "::notice::Using DEV environment"
          fi
          
          # These outputs are always set (with fallback)
          echo "region=${{ secrets.GCP_REGION || 'europe-central2' }}" >> $GITHUB_OUTPUT
          echo "artifact_registry=tradvisor" >> $GITHUB_OUTPUT
          echo "image_name=tradvisor" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          
          # Fallback for project_id (critical for docker tags)
          if [ "${{ github.event.inputs.environment }}" == "prod" ] || [ "${{ github.ref }}" == "refs/heads/production" ]; then
            echo "project_id=${{ secrets.PROD_GCP_PROJECT_ID || 'prod-tradvisor' }}" >> $GITHUB_OUTPUT
          else
            echo "project_id=${{ secrets.DEV_GCP_PROJECT_ID || 'dev-tradvisor' }}" >> $GITHUB_OUTPUT
          fi
          echo "artifact_registry=tradvisor" >> $GITHUB_OUTPUT
          echo "image_name=tradvisor" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Debug outputs
        run: |
          echo "Environment: ${{ steps.set-env.outputs.environment }}"
          echo "Project ID: ${{ steps.set-env.outputs.project_id }}"
          echo "Workload Identity Provider: ${{ steps.set-env.outputs.workload_identity_provider }}"
          echo "Service Account: ${{ steps.set-env.outputs.service_account }}"
          echo "Region: ${{ steps.set-env.outputs.region }}"

  # ============================================
  # Job 1: Build and push Docker image to GAR
  # ============================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: setup

    outputs:
      image-url: ${{ steps.build.outputs.image-url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug - Show all outputs
        run: |
          echo "environment: '${{ needs.setup.outputs.environment }}'"
          echo "project_id: '${{ needs.setup.outputs.project_id }}'"
          echo "region: '${{ needs.setup.outputs.region }}'"
          echo "artifact_registry: '${{ needs.setup.outputs.artifact_registry }}'"
          echo "image_name: '${{ needs.setup.outputs.image_name }}'"
          echo "image_tag: '${{ needs.setup.outputs.image_tag }}'"
          echo "workload_identity_provider: '${{ needs.setup.outputs.workload_identity_provider }}'"
          echo "service_account: '${{ needs.setup.outputs.service_account }}'"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.setup.outputs.environment == 'prod' && secrets.PROD_WORKLOAD_IDENTITY_PROVIDER || secrets.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ needs.setup.outputs.environment == 'prod' && secrets.PROD_SERVICE_ACCOUNT || secrets.DEV_SERVICE_ACCOUNT }}

      - name: Authenticate to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry repository if not exists
        run: |
          if ! gcloud artifacts repositories describe tradvisor --location=${{ secrets.GCP_REGION }} --quiet 2>/dev/null; then
            gcloud artifacts repositories create tradvisor \
              --location=${{ secrets.GCP_REGION }} \
              --description="Docker images for TRADVISOR application" \
              --repository-format="DOCKER"
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ needs.setup.outputs.project_id || 'prod-tradvisor' }}/tradvisor/tradvisor:${{ needs.setup.outputs.image_tag || github.sha }}
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ needs.setup.outputs.project_id || 'prod-tradvisor' }}/tradvisor/tradvisor:latest
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ needs.setup.outputs.project_id || 'prod-tradvisor' }}/tradvisor/tradvisor:${{ needs.setup.outputs.environment || 'prod' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image URL
        run: |
          echo "image-url=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ needs.setup.outputs.project_id || 'prod-tradvisor' }}/tradvisor/tradvisor:${{ needs.setup.outputs.image_tag || github.sha }}" >> $GITHUB_OUTPUT

  # ============================================
  # Job 2: Run Terraform to create infrastructure
  # ============================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: [setup, build]
    
    outputs:
      service_url: ${{ steps.apply.outputs.service_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update HashiCorp GPG keys
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Debug - Show WIF Provider
        run: |
          echo "workload_identity_provider: '${{ needs.setup.outputs.workload_identity_provider }}'"
          echo "service_account: '${{ needs.setup.outputs.service_account }}'"
          echo "project_id: '${{ needs.setup.outputs.project_id }}'"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.setup.outputs.environment == 'prod' && secrets.PROD_WORKLOAD_IDENTITY_PROVIDER || secrets.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ needs.setup.outputs.environment == 'prod' && secrets.PROD_SERVICE_ACCOUNT || secrets.DEV_SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
          -backend-config="bucket=${{ needs.setup.outputs.environment == 'prod' && secrets.PROD_GCP_PROJECT_ID || secrets.DEV_GCP_PROJECT_ID }}-tfstate" \
          -backend-config="prefix=state/${{ needs.setup.outputs.environment }}" \
          -upgrade

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="project_id=${{ needs.setup.outputs.project_id || 'prod-tradvisor' }}" \
            -var="region=${{ secrets.GCP_REGION || 'europe-central2' }}" \
            -var="docker_image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ needs.setup.outputs.project_id || 'prod-tradvisor' }}/tradvisor/tradvisor:${{ needs.setup.outputs.image_tag || github.sha }}" \
            -var="tradvisor_gmail_acc={\"SMTP_USERNAME\": \"${{ secrets.GMAIL_USERNAME }}\", \"SMTP_PASSWORD\": \"${{ secrets.GMAIL_PASSWORD }}\"}" \
            -var="openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}" \
            -var="environment=${{ needs.setup.outputs.environment || 'prod' }}" \
            -out=tfplan

      - name: Terraform Apply
        id: apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve tfplan
          echo "service_url=$(terraform output -raw service_url)" >> $GITHUB_OUTPUT

  # ============================================
  # Job 3: Verify deployment
  # ============================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: terraform
    timeout-minutes: 10
    
    steps:
      - name: Wait for deployment
        run: |
          echo "Waiting for service to be ready..."
          sleep 30

      - name: Check service health
        run: |
          SERVICE_URL="${{ needs.terraform.outputs.service_url }}"
          echo "Checking health at: $SERVICE_URL"
          
          # Try to fetch the page
          response=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL" --max-time 30 || echo "000")
          echo "HTTP Response: $response"
          
          if [ "$response" = "200" ] || [ "$response" = "301" ] || [ "$response" = "302" ]; then
            echo "✅ Service is responding!"
          else
            echo "⚠️ Service returned status: $response"
            # Don't fail the workflow, just warn
          fi
