name: Deploy to GCP

on:
  push:
    branches:
      - production
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Set environment variables based on branch or input
env:
  ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/production' && 'prod' || 'dev') }}
  # Environment-specific configuration
  PROJECT_ID: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_GCP_PROJECT_ID || secrets.DEV_GCP_PROJECT_ID }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_WORKLOAD_IDENTITY_PROVIDER || secrets.DEV_WORKLOAD_IDENTITY_PROVIDER }}
  SERVICE_ACCOUNT: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_SERVICE_ACCOUNT || secrets.DEV_SERVICE_ACCOUNT }}
  REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REGISTRY: tradvisor
  IMAGE_NAME: tradvisor
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # Job 1: Build and push Docker image to GAR
  # ============================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image-url: ${{ steps.build.outputs.image-url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Authenticate to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENVIRONMENT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image URL
        id: output
        run: |
          echo "image-url=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

  # ============================================
  # Job 2: Run Terraform to create infrastructure
  # ============================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: build
    
    outputs:
      service_url: ${{ steps.apply.outputs.service_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -upgrade

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="service_name=tradvisor-${{ env.ENVIRONMENT }}" \
            -var="docker_image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            -var="tradvisor_gmail_acc={\"SMTP_USERNAME\": \"${{ secrets.GMAIL_USERNAME }}\", \"SMTP_PASSWORD\": \"${{ secrets.GMAIL_PASSWORD }}\"}" \
            -var="openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}" \
            -var="auth_disabled=${{ env.ENVIRONMENT == 'prod' && 'false' || 'true' }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -out=tfplan
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}

      - name: Terraform Apply
        id: apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve tfplan
          echo "service_url=$(terraform output -raw service_url)" >> $GITHUB_OUTPUT

  # ============================================
  # Job 3: Verify deployment
  # ============================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: terraform
    timeout-minutes: 10
    
    steps:
      - name: Wait for deployment
        run: |
          echo "Waiting for service to be ready..."
          sleep 30

      - name: Check service health
        run: |
          SERVICE_URL="${{ needs.terraform.outputs.service_url }}"
          echo "Checking health at: $SERVICE_URL"
          
          # Try to fetch the page
          response=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL" --max-time 30 || echo "000")
          echo "HTTP Response: $response"
          
          if [ "$response" = "200" ] || [ "$response" = "301" ] || [ "$response" = "302" ]; then
            echo "✅ Service is responding!"
          else
            echo "⚠️ Service returned status: $response"
            # Don't fail the workflow, just warn
          fi

      - name: Get Cloud Run service details
        run: |
          gcloud run services describe tradvisor-${{ env.ENVIRONMENT }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="table(status.url,status.conditions.type,status.conditions.status)"