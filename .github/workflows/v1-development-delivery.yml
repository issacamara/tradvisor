name: Development delivery

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Development action; frontend publishes Hosting only"
        required: true
        type: choice
        options: [import, plan, apply, frontend]
      api_image:
        description: "Immutable development API image URI"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  delivery:
    if: github.ref_name == 'V1'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'dev-tradvisor-tfstate' }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX || 'state/dev' }}
      TRADVISOR_API_URL: ${{ vars.TRADVISOR_API_URL || 'https://tradvisor-v1-api-evatyq2akq-lm.a.run.app' }}
    environment:
      name: ${{ (inputs.action == 'apply' || inputs.action == 'frontend') && 'development-apply' || 'development-plan' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        if: inputs.action != 'frontend'
      - name: Authenticate to Google Cloud with workload identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEV_SERVICE_ACCOUNT }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          NEXT_PUBLIC_TRADVISOR_API_URL: ${{ vars.TRADVISOR_API_URL || 'https://tradvisor-v1-api-evatyq2akq-lm.a.run.app' }}
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_API_KEY" || { echo "Development Firebase API key is unavailable" >&2; exit 1; }
          npm ci
          npm run build
      - name: Build development API image
        if: inputs.action == 'apply'
        env:
          API_IMAGE: ${{ inputs.api_image }}
        run: |
          BUILD_ID="$(gcloud builds submit backend \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --tag="$API_IMAGE" \
            --async \
            --format='value(id)' \
            --quiet)"
          test -n "$BUILD_ID"
          while :; do
            STATUS="$(gcloud builds describe "$BUILD_ID" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format='value(status)')"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|CANCELLED|EXPIRED|TIMEOUT)
                echo "Cloud Build $BUILD_ID ended with status $STATUS" >&2
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done
      - name: Validate delivery inputs
        if: inputs.action != 'frontend'
        env:
          API_IMAGE: ${{ inputs.api_image }}
        run: |
          test -n "$API_IMAGE" || { echo "api_image is required for delivery" >&2; exit 1; }
          case "$API_IMAGE" in
            "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID"/*) ;;
            *) echo "api_image must target the configured environment Artifact Registry" >&2; exit 1;;
          esac
      - name: Validate delivery context
        if: inputs.action != 'frontend'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DEPLOY_ENV: development
          ALLOWED_BRANCH: V1
          EXPECTED_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          EXPECTED_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'dev-tradvisor-tfstate' }}
          EXPECTED_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX || 'state/dev' }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          DEPLOY_ACTION: ${{ inputs.action }}
          API_IMAGE: ${{ inputs.api_image }}
        run: bash scripts/deployment/guard.sh
      - name: Initialize Terraform backend
        if: inputs.action != 'frontend'
        working-directory: terraform
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=$TF_STATE_PREFIX"
      - name: Import existing development shares table
        if: inputs.action == 'import' || inputs.action == 'apply'
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          TF_VAR_manage_legacy_workflows: "true"
        run: |
          import_if_absent() {
            address="$1"
            resource_id="$2"
            if ! terraform state list | grep -Fxq "$address"; then
              terraform import "$address" "$resource_id"
            fi
          }
          import_if_absent google_bigquery_table.shares "projects/$TF_VAR_project_id/datasets/stocks/tables/shares"
          import_if_absent google_bigquery_table.brvm_companies "projects/$TF_VAR_project_id/datasets/stocks/tables/brvm_companies"
          import_if_absent google_bigquery_table.dividends "projects/$TF_VAR_project_id/datasets/stocks/tables/dividends"
          import_if_absent google_bigquery_table.financials "projects/$TF_VAR_project_id/datasets/stocks/tables/financials"
          import_if_absent google_bigquery_table.ratings "projects/$TF_VAR_project_id/datasets/stocks/tables/ratings"
      - name: Plan development changes
        if: inputs.action == 'plan'
        working-directory: terraform
        env:
          TF_VAR_configure_v1_api: "true"
          TF_VAR_configure_v1_runtime: "true"
          TF_VAR_environment: development
          TF_VAR_v1_cors_origins: ${{ vars.TRADVISOR_CORS_ORIGINS || 'https://dev-tradvisor.web.app,https://dev-tradvisor.firebaseapp.com' }}
          TF_VAR_manage_new_function_sources: "true"
          TF_VAR_manage_legacy_schedules: "false"
          TF_VAR_manage_legacy_workflows: "true"
          TF_VAR_v1_api_image: ${{ inputs.api_image }}
          TF_VAR_v1_batch_image: ${{ inputs.api_image }}
          TF_VAR_v1_batch_command: '["python", "-m", "backend.commands.daily_publication"]'
          TF_VAR_v1_financials_table: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}.stocks.financials
        run: terraform plan -out=tfplan
      - name: Apply reviewed development plan
        if: inputs.action == 'apply'
        working-directory: terraform
        env:
          TF_VAR_configure_v1_api: "true"
          TF_VAR_configure_v1_runtime: "true"
          TF_VAR_environment: development
          TF_VAR_v1_cors_origins: ${{ vars.TRADVISOR_CORS_ORIGINS || 'https://dev-tradvisor.web.app,https://dev-tradvisor.firebaseapp.com' }}
          TF_VAR_manage_new_function_sources: "true"
          TF_VAR_manage_legacy_schedules: "false"
          TF_VAR_manage_legacy_workflows: "true"
          TF_VAR_v1_api_image: ${{ inputs.api_image }}
          TF_VAR_v1_batch_image: ${{ inputs.api_image }}
          TF_VAR_v1_batch_command: '["python", "-m", "backend.commands.daily_publication"]'
          TF_VAR_v1_financials_table: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}.stocks.financials
        run: terraform apply -auto-approve
      - name: Deploy static frontend
        if: inputs.action == 'apply' || inputs.action == 'frontend'
        run: npx -y firebase-tools@latest deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
