name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements/test.lock
          python -m pip install --no-deps --no-build-isolation -e backend

      - name: Verify backend dependency locks
        run: |
          pip-compile --all-build-deps --allow-unsafe --strip-extras --generate-hashes \
            --output-file=backend/requirements/runtime.lock backend/pyproject.toml
          pip-compile --all-build-deps --allow-unsafe --strip-extras --generate-hashes \
            --extra=test --extra=type --extra=lock \
            --output-file=backend/requirements/test.lock backend/pyproject.toml
          pip-compile --strip-extras --generate-hashes \
            --output-file=archive/legacy-ingestion/scripts/requirements.lock \
            archive/legacy-ingestion/scripts/requirements.in
          git diff --exit-code -- backend/requirements archive/legacy-ingestion/scripts/requirements.lock

      - name: Run backend regression and wave suites
        run: python -m pytest tests -q

      - name: Type check backend authentication
        run: mypy --strict backend/auth tests/auth

      - name: Run application store tests
        run: python -m pytest tests/store -q

      - name: Type check application store
        run: mypy --strict backend/store tests/store

      - name: Check Python syntax
        run: python -m compileall archive/legacy-ingestion/scripts functions

      - name: Build and smoke-check the FI-1 job image
        run: |
          docker build --file functions/financials/Dockerfile --tag tradvisor-fi1-job:ci .
          docker_check_config() {
            docker run --rm \
              -e TRADVISOR_RUNTIME_TARGET=financial_ingestion_job \
              -e TRADVISOR_ENVIRONMENT=development \
              -e GOOGLE_CLOUD_PROJECT=fixture-project \
              -e TRADVISOR_TARGET_PROJECT_ID=fixture-project \
              -e TRADVISOR_ENVIRONMENT_PROJECT_ID=fixture-project \
              -e TRADVISOR_INGESTION_DATASET=stocks \
              -e TRADVISOR_INGESTION_COMPANIES_TABLE=fixture-project.stocks.brvm_companies \
              -e TRADVISOR_INGESTION_FINANCIALS_TABLE=fixture-project.stocks.financials \
              -e TRADVISOR_INGESTION_FINANCIALS_STAGING_TABLE=fixture-project.stocks.financials_staging \
              -e TRADVISOR_FINANCIALS_MODEL_PRIMARY=gemma-4-31b-it \
              -e TRADVISOR_FINANCIALS_MODEL_FALLBACKS=nvidia/nemotron-3.5-lightning:free,openai/gpt-4o-mini \
              -e TRADVISOR_FINANCIALS_MAX_CONCURRENT_REQUESTS=4 \
              -e TRADVISOR_FINANCIALS_MAX_REPORTS_PER_SYMBOL=5 \
              -e TRADVISOR_FINANCIALS_MAX_ATTEMPTS_PER_MODEL=1 \
              "$@" \
              tradvisor-fi1-job:ci --check-config
          }

          docker_check_config | grep -q '"selection_mode":"historical"'
          docker_check_config \
            -e TRADVISOR_FINANCIALS_SELECTION_MODE=historical \
            | grep -q '"selection_mode":"historical"'
          docker_check_config \
            -e TRADVISOR_FINANCIALS_SELECTION_MODE=previous_year \
            | grep -q '"selection_mode":"previous_year"'
          if docker_check_config \
            -e TRADVISOR_FINANCIALS_SELECTION_MODE=invalid \
            > /tmp/fi1-invalid-mode.log 2>&1; then
            echo "FI-1 accepted an invalid selection mode."
            exit 1
          fi
          grep -q TRADVISOR_FINANCIALS_SELECTION_MODE /tmp/fi1-invalid-mode.log
          if docker_check_config \
            -e TRADVISOR_FINANCIALS_SELECTION_MODE= \
            > /tmp/fi1-blank-mode.log 2>&1; then
            echo "FI-1 accepted a blank selection mode."
            exit 1
          fi
          grep -q TRADVISOR_FINANCIALS_SELECTION_MODE /tmp/fi1-blank-mode.log

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Verify Terraform provider lock
        working-directory: terraform
        run: |
          terraform init -backend=false
          git diff --exit-code -- .terraform.lock.hcl

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Install locked OpenAPI generator dependencies
        run: npm ci --prefix scripts/generate-client --ignore-scripts --no-audit --no-fund

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Type check frontend
        run: npm --prefix frontend run typecheck

      - name: Run frontend unit and contract tests
        run: npm --prefix frontend test

      - name: Build static application export
        run: npm --prefix frontend run build

      - name: Verify generated OpenAPI client
        run: |
          python -m pip install --require-hashes -r backend/requirements/runtime.lock
          python -m pip install --no-deps --no-build-isolation backend
          bash scripts/generate-client/check.sh

      - name: Check frontend dependency advisories
        run: npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Check tracked files for obvious secrets
        run: |
          set -euo pipefail
          if git grep -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|private_key_id|client_secret|SMTP_PASSWORD' -- . ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi

      - name: Verify pinned delivery inputs
        run: python scripts/ci/verify_delivery_inputs.py

  release:
    needs: [validate, frontend]
    if: >-
      github.event_name == 'push' && github.ref_name == 'development' &&
      needs.validate.result == 'success' && needs.frontend.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  delivery:
    needs: release
    if: github.event_name == 'push' && github.ref_name == 'development'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/cd-development.yml
    with:
      automatic: true
      action: apply
      release_id: ${{ github.sha }}
      release_run_id: ${{ github.run_id }}
      openrouter_secret_id: openrouter-api-key
      retirement_phase: prepare
    secrets: inherit
