name: Terraform plan

on:
  pull_request:
    branches: [development, main]
    paths: [terraform/**, .github/workflows/terraform.yml]
  push:
    branches: [development, main]
    paths: [terraform/**, .github/workflows/terraform.yml]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && ((github.base_ref == 'main') && 'production-plan' || 'development-plan') || ((github.ref_name == 'main') && 'production' || 'development') }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_v1_environment_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_environment: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'production' || 'development' }}
      TF_VAR_configure_v1_api: 'true'
      TF_VAR_configure_v1_runtime: 'true'
      TF_VAR_manage_new_function_sources: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_manage_legacy_project_services: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_manage_legacy_schedules: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_manage_legacy_workflows: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_terraform_deployer_service_account: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && secrets.PROD_SERVICE_ACCOUNT || secrets.DEV_SERVICE_ACCOUNT }}
      TF_VAR_v1_api_image: ${{ vars.APPROVED_API_IMAGE }}
      TF_VAR_v1_batch_image: ${{ vars.APPROVED_API_IMAGE }}
      TF_VAR_v1_batch_command: '["python", "-m", "backend.commands.daily_publication"]'
      TF_VAR_v1_financials_table: ${{ format('{0}.stocks.financials', vars.GCP_PROJECT_ID) }}
      TF_VAR_v1_cors_origins: ${{ vars.TRADVISOR_CORS_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated target and approved image
        shell: bash
        run: |
          if [ "$TF_VAR_environment" = production ]; then
            test "$GCP_PROJECT_ID" = prod-tradvisor
            test "$TF_STATE_BUCKET" = prod-tradvisor-tfstate
            test "$TF_STATE_PREFIX" = state/prod
          else
            test "$GCP_PROJECT_ID" = dev-tradvisor
            test "$TF_STATE_BUCKET" = dev-tradvisor-tfstate
            test "$TF_STATE_PREFIX" = state/dev
          fi
          test -n "$GCP_REGION"
          [[ "$TF_VAR_v1_api_image" =~ ^$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/.+@sha256:[0-9a-f]{64}$ ]]
          test -n "$TF_VAR_v1_cors_origins"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && secrets.PROD_WORKLOAD_IDENTITY_PROVIDER || secrets.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && secrets.PROD_SERVICE_ACCOUNT || secrets.DEV_SERVICE_ACCOUNT }}
      - name: Plan without publishing state or plan contents
        working-directory: terraform
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=$TF_STATE_PREFIX" -input=false -no-color >/dev/null
          terraform plan -out=tfplan -input=false -no-color >/dev/null
          terraform show -json tfplan | jq -r '[.resource_changes[]?.change.actions[]] | group_by(.) | map({action: .[0], count: length})'
