name: Terraform plan

on:
  pull_request:
    branches: [development, main]
    paths: [terraform/**, .github/workflows/terraform.yml]
  push:
    branches: [development, main]
    paths: [terraform/**, .github/workflows/terraform.yml]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && ((github.base_ref == 'main') && 'production-plan' || 'development-plan') || ((github.ref_name == 'main') && 'production' || 'development') }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_v1_environment_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_environment: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'production' || 'development' }}
      TF_VAR_configure_v1_api: 'true'
      TF_VAR_configure_v1_runtime: 'true'
      TF_VAR_manage_new_function_sources: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_manage_legacy_project_services: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_manage_legacy_schedules: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_manage_legacy_workflows: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_manage_fi1_financial_job: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'false' || 'true' }}
      TF_VAR_terraform_deployer_service_account: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && secrets.PROD_SERVICE_ACCOUNT || secrets.DEV_SERVICE_ACCOUNT }}
      TF_VAR_v1_api_image: ${{ vars.APPROVED_API_IMAGE }}
      TF_VAR_v1_batch_image: ${{ vars.APPROVED_API_IMAGE }}
      TF_VAR_v1_batch_command: '["python", "-m", "backend.commands.daily_publication"]'
      TF_VAR_v1_financials_table: ${{ format('{0}.stocks.financials', vars.GCP_PROJECT_ID) }}
      TF_VAR_v1_cors_origins: ${{ vars.TRADVISOR_CORS_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage development dispatcher prepare phase
        if: env.TF_VAR_environment == 'development'
        working-directory: terraform
        run: |
          printf '%s\n' \
            'resource "google_cloud_run_v2_service" "workflow_dispatcher" {' \
            '  count               = 1' \
            '  name                = "${var.v1_api_service_name}-workflow-dispatcher"' \
            '  location            = var.region' \
            '  project             = var.project_id' \
            '  ingress             = "INGRESS_TRAFFIC_INTERNAL_ONLY"' \
            '  deletion_protection = false' \
            '  template {' \
            '    containers {' \
            '      image = var.v1_api_image' \
            '    }' \
            '  }' \
            '  lifecycle {' \
            '    prevent_destroy = false' \
            '    ignore_changes  = [template]' \
            '  }' \
            '}' > retired-workflow-dispatcher.tf
      - name: Prepare development baseline checkout
        if: github.event_name == 'pull_request' && github.base_ref == 'development'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline_root="$RUNNER_TEMP/tradvisor-development-baseline"
          git fetch --no-tags origin "$BASE_SHA"
          git show "$BASE_SHA:.github/workflows/terraform.yml" > "$RUNNER_TEMP/development-baseline-terraform.yml"
          extract_dispatcher_step() {
            awk '
              /^      - name: Stage development dispatcher prepare phase$/ { in_step=1; next }
              in_step && /^      - name: / { exit }
              in_step { print }
            ' "$1"
          }
          extract_dispatcher_step "$GITHUB_WORKSPACE/.github/workflows/terraform.yml" \
            > "$RUNNER_TEMP/proposed-dispatcher-step.txt"
          extract_dispatcher_step "$RUNNER_TEMP/development-baseline-terraform.yml" \
            > "$RUNNER_TEMP/baseline-dispatcher-step.txt"
          if ! cmp -s "$RUNNER_TEMP/proposed-dispatcher-step.txt" \
            "$RUNNER_TEMP/baseline-dispatcher-step.txt"; then
            echo "Development baseline comparison: inputs differ." >&2
            exit 1
          fi
          git worktree add --detach "$baseline_root" "$BASE_SHA" >/dev/null
          cp terraform/retired-workflow-dispatcher.tf "$baseline_root/terraform/retired-workflow-dispatcher.tf"
      - name: Find latest successful development deployment
        id: deployment
        if: env.TF_VAR_environment == 'development'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidates="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("tradvisor-development-deployed-")) | [.name, (.workflow_run.id | tostring), .created_at] | @tsv' \
            | sort -r -k3)"
          while IFS=$'\t' read -r artifact_name run_id _; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            [[ "$artifact_name" =~ ^tradvisor-development-deployed-[a-zA-Z0-9._-]+$ ]] || continue
            run_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq '[.head_branch, .event, .conclusion] | @tsv')"
            if [ "$run_metadata" = $'development\tpush\tsuccess' ] || \
              [ "$run_metadata" = $'development\tworkflow_dispatch\tsuccess' ]; then
              echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$candidates"
          test -n "${artifact_name:-}"
      - uses: actions/download-artifact@v4
        if: env.TF_VAR_environment == 'development'
        with:
          name: ${{ steps.deployment.outputs.artifact_name }}
          run-id: ${{ steps.deployment.outputs.run_id }}
          github-token: ${{ github.token }}
          path: development-deployment
      - name: Resolve deployed API and FI-1 images
        id: deployed-images
        if: env.TF_VAR_environment == 'development'
        env:
          DEPLOYMENT_ARTIFACT: ${{ steps.deployment.outputs.artifact_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          evidence = json.loads(Path("development-deployment/development-deployment.json").read_text())
          assert re.fullmatch(r"[0-9a-f]{40}", evidence["release_id"])
          assert os.environ["DEPLOYMENT_ARTIFACT"] == f"tradvisor-development-deployed-{evidence['release_id']}"
          assert evidence["commit"] == evidence["release_id"]
          backend_digest = evidence["backend_digest"]
          fi1_digest = evidence["fi1_job_digest"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", backend_digest)
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", fi1_digest)
          registry = f"{os.environ['GCP_REGION']}-docker.pkg.dev/{os.environ['GCP_PROJECT_ID']}/{os.environ['ARTIFACT_REPOSITORY']}"
          api_image = f"{registry}/api:{evidence['release_id']}@{backend_digest}"
          fi1_image = f"{registry}/financial-ingestion:{evidence['release_id']}@{fi1_digest}"
          print(f"::add-mask::{api_image}")
          print(f"::add-mask::{fi1_image}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"api_image={api_image}", file=output)
              print(f"fi1_image={fi1_image}", file=output)
          PY
      - name: Validate isolated target and approved image
        env:
          TF_VAR_v1_api_image: ${{ env.TF_VAR_environment == 'development' && steps.deployed-images.outputs.api_image || vars.APPROVED_API_IMAGE }}
          TF_VAR_v1_batch_image: ${{ env.TF_VAR_environment == 'development' && steps.deployed-images.outputs.api_image || vars.APPROVED_API_IMAGE }}
          TF_VAR_fi1_financial_job_image: ${{ steps.deployed-images.outputs.fi1_image }}
        shell: bash
        run: |
          if [ "$TF_VAR_environment" = production ]; then
            test "$GCP_PROJECT_ID" = prod-tradvisor
            test "$TF_STATE_BUCKET" = prod-tradvisor-tfstate
            test "$TF_STATE_PREFIX" = state/prod
          else
            test "$GCP_PROJECT_ID" = dev-tradvisor
            test "$TF_STATE_BUCKET" = dev-tradvisor-tfstate
            test "$TF_STATE_PREFIX" = state/dev
          fi
          test -n "$GCP_REGION"
          [[ "$TF_VAR_v1_api_image" =~ ^$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/.+@sha256:[0-9a-f]{64}$ ]]
          [[ "$TF_VAR_v1_batch_image" =~ ^$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/.+@sha256:[0-9a-f]{64}$ ]]
          if [ "$TF_VAR_environment" = development ]; then
            [[ "$TF_VAR_fi1_financial_job_image" =~ ^$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/.+@sha256:[0-9a-f]{64}$ ]]
          fi
          test -n "$TF_VAR_v1_cors_origins"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && secrets.PROD_WORKLOAD_IDENTITY_PROVIDER || secrets.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && secrets.PROD_SERVICE_ACCOUNT || secrets.DEV_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Plan without publishing state or plan contents
        working-directory: terraform
        env:
          TF_VAR_v1_api_image: ${{ env.TF_VAR_environment == 'development' && steps.deployed-images.outputs.api_image || vars.APPROVED_API_IMAGE }}
          TF_VAR_v1_batch_image: ${{ env.TF_VAR_environment == 'development' && steps.deployed-images.outputs.api_image || vars.APPROVED_API_IMAGE }}
          TF_VAR_fi1_financial_job_image: ${{ steps.deployed-images.outputs.fi1_image }}
          TF_VAR_publication_control_service_url: ${{ vars.TRADVISOR_PUBLICATION_CONTROL_SERVICE_URL }}
        run: |
          baseline_root="$RUNNER_TEMP/tradvisor-development-baseline"
          cleanup_private_plans() {
            rm -f tfplan "$RUNNER_TEMP/development-baseline.tfplan"
            git worktree remove --force "$baseline_root" >/dev/null 2>&1 || true
          }
          trap cleanup_private_plans EXIT
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_BASE_REF" = development ]; then
            if ! cmp -s .terraform.lock.hcl "$baseline_root/terraform/.terraform.lock.hcl"; then
              echo "Development baseline comparison: inputs differ." >&2
              exit 1
            fi
            python3 ../scripts/deployment/classify_fi1_baseline_plan.py \
              --baseline-plan "$RUNNER_TEMP/development-baseline.tfplan" \
              --baseline-working-directory "$RUNNER_TEMP/tradvisor-development-baseline/terraform" \
              --proposed-plan "$GITHUB_WORKSPACE/terraform/tfplan" \
              --proposed-working-directory "$GITHUB_WORKSPACE/terraform" \
              --state-bucket "$TF_STATE_BUCKET" \
              --state-prefix "$TF_STATE_PREFIX" \
              --gcp-project "$GCP_PROJECT_ID"
          else
            if ! terraform init \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="prefix=$TF_STATE_PREFIX" \
              -input=false -no-color >/dev/null 2>&1; then
              echo "Terraform plan preparation failed." >&2
              exit 1
            fi
            if ! terraform plan -out=tfplan -input=false -no-color >/dev/null 2>&1; then
              echo "Terraform plan generation failed." >&2
              exit 1
            fi
          fi
          if [ "$TF_VAR_environment" = development ]; then
            set -o pipefail
            terraform show -json tfplan | python3 ../scripts/deployment/verify_fi1_staging_plan.py
          fi
          terraform show -json tfplan | jq -r '[.resource_changes[]?.change.actions[]] | group_by(.) | map({action: .[0], count: length})'
