name: Development delivery

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      action:
        description: "Development action; frontend publishes Hosting only"
        required: true
        type: choice
        options: [import, plan, apply, frontend]
      api_image:
        description: "Immutable development API image URI"
        required: false
        type: string
      release_id:
        description: "Release artifact bundle identifier"
        required: true
        type: string
      release_run_id:
        description: "GitHub Actions run ID that produced the release bundle"
        required: true
        type: string
      terraform_plan_run_id:
        description: "GitHub Actions run ID containing the reviewed Terraform plan (apply only)"
        required: false
        type: string
      retirement_phase:
        description: "Retired dispatcher transition phase"
        required: true
        type: choice
        options: [prepare, destroy]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  prepare:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    secrets: inherit
  delivery:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'development'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'dev-tradvisor-tfstate' }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX || 'state/dev' }}
      TRADVISOR_API_URL: ${{ vars.TRADVISOR_API_URL || 'https://tradvisor-v1-api-evatyq2akq-lm.a.run.app' }}
    environment:
      name: development
    steps:
      - uses: actions/checkout@v4
      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: tradvisor-${{ inputs.release_id }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release
      - name: Bind development delivery to the release commit
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          release_commit="$(python3 -c 'import json; print(json.load(open("release/manifest/release-manifest.json"))["commit"])')"
          test "$RELEASE_ID" = "$release_commit"
          test "$GITHUB_SHA" = "$release_commit"
      - uses: hashicorp/setup-terraform@v3
        if: inputs.action != 'frontend'
        with:
          terraform_version: 1.9.8
      - name: Authenticate to Google Cloud with workload identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require a reviewed Terraform plan run
        if: inputs.action == 'apply'
        env:
          TERRAFORM_PLAN_RUN_ID: ${{ inputs.terraform_plan_run_id }}
        run: test -n "$TERRAFORM_PLAN_RUN_ID" || { echo "terraform_plan_run_id is required for apply" >&2; exit 1; }
      - name: Download reviewed development Terraform plan
        if: inputs.action == 'apply'
        env:
          PLAN_RUN_ID: ${{ inputs.terraform_plan_run_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          RETIREMENT_PHASE: ${{ inputs.retirement_phase }}
        run: |
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_ID" =~ ^[a-zA-Z0-9._-]+$ ]]
          mkdir reviewed-plan
          gcloud storage cp "gs://$TF_STATE_BUCKET/reviewed-plans/development/$PLAN_RUN_ID/$RELEASE_ID-$RETIREMENT_PHASE.tar.gz" reviewed-plan.tar.gz
          tar -xzf reviewed-plan.tar.gz -C reviewed-plan
      - name: Validate delivery inputs
        if: inputs.action != 'frontend'
        env:
          API_IMAGE: ${{ inputs.api_image }}
        run: |
          test -n "$API_IMAGE" || { echo "api_image is required for delivery" >&2; exit 1; }
          case "$API_IMAGE" in
            "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID"/*@sha256:*) ;;
            *) echo "api_image must be an immutable digest in the configured environment Artifact Registry" >&2; exit 1;;
          esac
      - name: Validate delivery context
        if: inputs.action != 'frontend'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DEPLOY_ENV: development
          ALLOWED_BRANCH: development
          EXPECTED_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          EXPECTED_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'dev-tradvisor-tfstate' }}
          EXPECTED_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX || 'state/dev' }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          DEPLOY_ACTION: ${{ inputs.action }}
          API_IMAGE: ${{ inputs.api_image }}
        run: bash scripts/deployment/guard.sh
      - name: Bind delivery image to the verified release manifest
        if: inputs.action != 'frontend'
        env:
          API_IMAGE: ${{ inputs.api_image }}
        run: |
          expected_digest="$(python3 -c 'import json; print(json.load(open("release/manifest/release-manifest.json"))["backend"]["digest"])')"
          case "$API_IMAGE" in
            *@"$expected_digest") ;;
            *) echo "api_image does not match the release manifest backend digest" >&2; exit 1;;
          esac
      - name: Verify reviewed development Terraform plan
        if: inputs.action == 'apply'
        env:
          API_IMAGE: ${{ inputs.api_image }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          python3 scripts/deployment/terraform_plan_attestation.py verify \
            --plan reviewed-plan/tfplan \
            --attestation reviewed-plan/plan-attestation.json \
            --release-manifest release/manifest/release-manifest.json \
            --release-run-id "$RELEASE_RUN_ID" \
            --environment development \
            --project-id "$GCP_PROJECT_ID" \
            --state-bucket "$TF_STATE_BUCKET" \
            --state-prefix "$TF_STATE_PREFIX" \
            --api-image "$API_IMAGE"
      - name: Initialize Terraform backend
        if: inputs.action != 'frontend'
        working-directory: terraform
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=$TF_STATE_PREFIX"
      - name: Stage retired dispatcher protection transition
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: terraform
        env:
          RETIREMENT_PHASE: ${{ inputs.retirement_phase }}
        run: |
          if [ "$RETIREMENT_PHASE" = "prepare" ]; then
            printf '%s\n' \
              'resource "google_cloud_run_v2_service" "workflow_dispatcher" {' \
              '  count               = 1' \
              '  name                = "${var.v1_api_service_name}-workflow-dispatcher"' \
              '  location            = var.region' \
              '  project             = var.project_id' \
              '  ingress             = "INGRESS_TRAFFIC_INTERNAL_ONLY"' \
              '  deletion_protection = false' \
              '  template {' \
              '    containers {' \
              '      image = var.v1_api_image' \
              '    }' \
              '  }' \
              '  lifecycle {' \
              '    prevent_destroy = false' \
              '    ignore_changes  = [template]' \
              '  }' \
              '}' > retired-workflow-dispatcher.tf
          fi
      - name: Import existing development shares table
        if: inputs.action == 'import' || inputs.action == 'apply'
        working-directory: terraform
        env:
          RETIREMENT_PHASE: ${{ inputs.retirement_phase }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          TF_VAR_manage_legacy_workflows: "true"
          TF_VAR_manage_legacy_schedules: "true"
        run: |
          import_if_absent() {
            address="$1"
            resource_id="$2"
            if ! terraform state list | grep -Fxq "$address"; then
              terraform import "$address" "$resource_id"
            fi
          }
          import_if_absent google_bigquery_table.shares "projects/$TF_VAR_project_id/datasets/stocks/tables/shares"
          import_if_absent google_bigquery_table.brvm_companies "projects/$TF_VAR_project_id/datasets/stocks/tables/brvm_companies"
          import_if_absent google_bigquery_table.dividends "projects/$TF_VAR_project_id/datasets/stocks/tables/dividends"
          import_if_absent google_bigquery_table.financials "projects/$TF_VAR_project_id/datasets/stocks/tables/financials"
          import_if_absent google_bigquery_table.ratings "projects/$TF_VAR_project_id/datasets/stocks/tables/ratings"
          import_if_absent 'google_cloud_scheduler_job.jobs["job1"]' "projects/$TF_VAR_project_id/locations/$GCP_REGION/jobs/shares-job"
          import_if_absent 'google_cloud_scheduler_job.jobs["job3"]' "projects/$TF_VAR_project_id/locations/$GCP_REGION/jobs/dividends-job"
          import_if_absent 'google_cloud_scheduler_job.jobs["job5"]' "projects/$TF_VAR_project_id/locations/$GCP_REGION/jobs/financials-job"
          import_if_absent 'google_cloud_scheduler_job.jobs["job6"]' "projects/$TF_VAR_project_id/locations/$GCP_REGION/jobs/ratings-job"
      - name: Restore temporary Terraform Cloud Tasks permission
        if: inputs.action == 'plan' || inputs.action == 'apply'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
        run: |
          terraform_principal="$(jq -r '.service_account_impersonation_url // empty | capture("serviceAccounts/(?<email>[^:]+)").email' "$GOOGLE_GHA_CREDS_PATH")"
          case "$terraform_principal" in
            *.iam.gserviceaccount.com) ;;
            *) echo "Authenticated deployment principal is not a service account" >&2; exit 1 ;;
          esac
          gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
            --member="serviceAccount:$terraform_principal" \
            --role="roles/cloudtasks.admin" \
            --quiet
          for attempt in {1..12}; do
            if gcloud tasks queues describe publication-control-dispatch \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --quiet >/dev/null; then
              exit 0
            fi
            sleep 30
          done
          echo "Temporary Cloud Tasks permission was not visible after 360 seconds" >&2
          exit 1
      - name: Plan development changes
        if: inputs.action == 'plan'
        working-directory: terraform
        env:
          RETIREMENT_PHASE: ${{ inputs.retirement_phase }}
          TF_VAR_v1_environment_project_id: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          TF_VAR_configure_v1_api: "true"
          TF_VAR_configure_v1_runtime: "true"
          TF_VAR_environment: development
          TF_VAR_v1_cors_origins: ${{ vars.TRADVISOR_CORS_ORIGINS || 'https://dev-tradvisor.web.app,https://dev-tradvisor.firebaseapp.com' }}
          TF_VAR_manage_new_function_sources: "true"
          TF_VAR_manage_legacy_project_services: "true"
          TF_VAR_terraform_deployer_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          TF_VAR_manage_legacy_schedules: "true"
          TF_VAR_manage_legacy_workflows: "true"
          TF_VAR_v1_api_image: ${{ inputs.api_image }}
          TF_VAR_v1_batch_image: ${{ inputs.api_image }}
          TF_VAR_v1_batch_command: '["python", "-m", "backend.commands.daily_publication"]'
          TF_VAR_v1_financials_table: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}.stocks.financials
        run: |
          terraform plan -out=tfplan -no-color >/dev/null 2>&1 || { echo "Terraform plan failed; inspect the private operator evidence." >&2; exit 1; }
          terraform show -json tfplan | jq -r '[.resource_changes[]?.change.actions[]] | group_by(.) | map({action: .[0], count: length})'
      - name: Create reviewed development Terraform plan attestation
        if: inputs.action == 'plan'
        working-directory: terraform
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          API_IMAGE: ${{ inputs.api_image }}
        run: |
          python3 ../scripts/deployment/terraform_plan_attestation.py create \
            --plan tfplan \
            --release-manifest ../release/manifest/release-manifest.json \
            --release-run-id "$RELEASE_RUN_ID" \
            --environment development \
            --project-id "$GCP_PROJECT_ID" \
            --state-bucket "$TF_STATE_BUCKET" \
            --state-prefix "$TF_STATE_PREFIX" \
            --api-image "$API_IMAGE" \
            --output plan-attestation.json
          mkdir -p ../terraform-plan-artifact
          mkdir -p ../terraform-plan-artifact/function-source-archives
          cp ./*.zip ../terraform-plan-artifact/function-source-archives/
          cp tfplan plan-attestation.json ../terraform-plan-artifact/
      - name: Store reviewed development Terraform plan privately
        if: inputs.action == 'plan'
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RETIREMENT_PHASE: ${{ inputs.retirement_phase }}
        run: |
          [[ "$RELEASE_ID" =~ ^[a-zA-Z0-9._-]+$ ]]
          tar -czf reviewed-plan.tar.gz -C terraform-plan-artifact .
          gcloud storage cp --no-clobber reviewed-plan.tar.gz "gs://$TF_STATE_BUCKET/reviewed-plans/development/$GITHUB_RUN_ID/$RELEASE_ID-$RETIREMENT_PHASE.tar.gz"
      - name: Clear protection on retired workflow dispatcher
        if: inputs.action == 'apply'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
        run: |
          if gcloud run services describe "tradvisor-v1-api-workflow-dispatcher" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=export > retired-workflow-dispatcher.yaml; then
            sed -i.bak 's/deletionProtection: true/deletionProtection: false/' \
              retired-workflow-dispatcher.yaml
            gcloud run services replace retired-workflow-dispatcher.yaml \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet
          else
            echo "Retired workflow dispatcher does not exist; skipping protection cleanup."
          fi
      - name: Apply reviewed development plan
        if: inputs.action == 'apply'
        working-directory: terraform
        env:
          TF_VAR_v1_environment_project_id: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
          TF_VAR_configure_v1_api: "true"
          TF_VAR_configure_v1_runtime: "true"
          TF_VAR_environment: development
          TF_VAR_v1_cors_origins: ${{ vars.TRADVISOR_CORS_ORIGINS || 'https://dev-tradvisor.web.app,https://dev-tradvisor.firebaseapp.com' }}
          TF_VAR_manage_new_function_sources: "true"
          TF_VAR_manage_legacy_project_services: "true"
          TF_VAR_terraform_deployer_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          TF_VAR_manage_legacy_schedules: "true"
          TF_VAR_manage_legacy_workflows: "true"
          TF_VAR_v1_api_image: ${{ inputs.api_image }}
          TF_VAR_v1_batch_image: ${{ inputs.api_image }}
          TF_VAR_v1_batch_command: '["python", "-m", "backend.commands.daily_publication"]'
          TF_VAR_v1_financials_table: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}.stocks.financials
        run: |
          cp ../reviewed-plan/function-source-archives/*.zip .
          terraform apply -auto-approve ../reviewed-plan/tfplan >/dev/null 2>&1 || { echo "Terraform apply failed; inspect the private operator evidence." >&2; exit 1; }
      - name: Build development frontend
        if: inputs.action == 'apply' || inputs.action == 'frontend'
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_TRADVISOR_API_URL: ${{ vars.TRADVISOR_API_URL || 'https://tradvisor-v1-api-evatyq2akq-lm.a.run.app' }}
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_API_KEY"
          test -n "$NEXT_PUBLIC_TRADVISOR_API_URL"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Deploy static frontend
        if: inputs.action == 'apply' || inputs.action == 'frontend'
        run: npx --yes firebase-tools@13.29.1 deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
      - name: Remove temporary Terraform Cloud Tasks permission
        if: always() && (inputs.action == 'plan' || inputs.action == 'apply')
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dev-tradvisor' }}
        run: |
          terraform_principal="$(jq -r '.service_account_impersonation_url // empty | capture("serviceAccounts/(?<email>[^:]+)").email' "$GOOGLE_GHA_CREDS_PATH")"
          case "$terraform_principal" in
            *.iam.gserviceaccount.com) ;;
            *) echo "Authenticated deployment principal is not a service account" >&2; exit 1 ;;
          esac
          gcloud projects remove-iam-policy-binding "$GCP_PROJECT_ID" \
            --member="serviceAccount:$terraform_principal" \
            --role="roles/cloudtasks.admin" \
            --quiet
      - name: Check deployed development endpoints
        if: inputs.action == 'apply'
        run: |
          curl --fail --silent --show-error --retry 3 "$TRADVISOR_API_URL/healthz" >/dev/null
          curl --fail --silent --show-error --retry 3 https://dev-tradvisor.web.app/ >/dev/null
      - name: Record development deployment evidence
        if: inputs.action == 'apply'
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg release_id "$RELEASE_ID" \
            --arg digest "$(python3 -c 'import json; print(json.load(open("release/manifest/release-manifest.json"))["backend"]["digest"])')" \
            '{commit:$commit,release_id:$release_id,backend_digest:$digest}' > development-deployment.json
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'apply'
        with:
          name: tradvisor-development-deployed-${{ inputs.release_id }}
          path: development-deployment.json
          if-no-files-found: error
