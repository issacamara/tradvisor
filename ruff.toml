# Shared lint baseline. Start narrow (real bugs only) and widen over time.
target-version = "py311"
extend-exclude = ["archive", "frontend", "terraform"]

[lint]
select = ["E9", "F", "B"]
ignore = [
  "B008",  # FastAPI Depends() in argument defaults
  "B009",  # getattr with constant, used deliberately in places
  "B023",  # loop-variable closures in the test harnesses; revisit separately
  "B905",  # zip(strict=) not required yet
]
