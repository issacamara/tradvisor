[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradvisor-backend"
version = "0.1.0"
description = "Tradvisor V1 backend package foundation"
requires-python = ">=3.11"
dependencies = ["pydantic==2.10.6"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
type = ["mypy==1.15.0"]
firestore = ["google-cloud-firestore>=2.16,<3"]

[tool.setuptools]
package-dir = { backend = "." }
packages = ["backend", "backend.analysis", "backend.contracts", "backend.paper", "backend.publication", "backend.store"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
