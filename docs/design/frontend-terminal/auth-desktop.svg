<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Authentication — desktop proposal</title><desc id="desc">1440 pixel desktop invitation-only sign-in. All fields are presentation examples, not functional credentials.</desc><rect width="100%" height="100%" fill="#081116" /><rect x="0" y="72" width="1440" height="828" rx="8" fill="#081116" /><rect x="28" y="20" width="30" height="30" rx="8" fill="#29C98B" /><text x="43" y="42" fill="#081116" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">T</text><text x="70" y="40" fill="#F0F6F4" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start">TRADVISOR</text><rect x="1292" y="22" width="116" height="26" rx="13" fill="#12242B" stroke="#67D8E6" /><text x="1350.0" y="40" fill="#67D8E6" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">INVITED ACCESS</text><path d="M0 72H1440" stroke="#29414A" stroke-width="1" /><text x="180" y="260" fill="#29C98B" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">TRADVISOR  /  INVITED ACCESS</text><text x="180" y="326" fill="#F0F6F4" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="42" font-weight="650" text-anchor="start">Research with the</text><text x="180" y="376" fill="#F0F6F4" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="42" font-weight="650" text-anchor="start">evidence in view.</text><text x="180" y="426" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Separate Swing and Long-Term workspaces.</text><text x="180" y="460" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Published results stay tied to their evidence and date.</text><rect x="180" y="520" width="430" height="112" rx="8" fill="#0D1A20" stroke="#29414A" /><text x="206" y="555" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">INVESTOR RESEARCH</text><text x="206" y="590" fill="#F0F6F4" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Swing signals  ·  Growth evidence  ·  Dividend facts</text><rect x="770" y="170" width="490" height="580" rx="12" fill="#0D1A20" stroke="#29414A" /><text x="812" y="218" fill="#F0F6F4" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="start">Account access</text><text x="812" y="248" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Sign in with your invited account.</text><rect x="812" y="278" width="192" height="40" rx="5" fill="#12242B" stroke="#67D8E6" /><text x="908" y="303" fill="#67D8E6" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Sign in</text><text x="1095" y="303" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle">Create account</text><text x="812" y="359" fill="#F0F6F4" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="550" text-anchor="start">Email address</text><rect x="812" y="374" width="406" height="46" rx="5" fill="#12242B" stroke="#29414A" /><text x="830" y="403" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">name@example.com  ·  fixture</text><text x="812" y="448" fill="#F0F6F4" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="550" text-anchor="start">Password</text><rect x="812" y="463" width="406" height="46" rx="5" fill="#12242B" stroke="#29414A" /><text x="830" y="492" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">••••••••••••</text><text x="812" y="532" fill="#67D8E6" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="550" text-anchor="start">Forgot password?</text><rect x="812" y="560" width="406" height="48" rx="5" fill="#29C98B" /><text x="1015" y="590" fill="#081116" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="middle">Continue</text><text x="812" y="638" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Verified email and current invitation are required.</text><text x="812" y="681" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">ACCESS STATE</text><rect x="812" y="696" width="164" height="26" rx="13" fill="#12242B" stroke="#F2BE62" /><text x="894.0" y="714" fill="#F2BE62" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">CHECKING INVITATION</text><text x="990" y="714" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Example status · FIXTURE</text><text x="180" y="848" fill="#A8BBB5" font-family="IBM Plex Sans,Inter,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Illustrative interface only · no user or credential data shown.</text></svg>